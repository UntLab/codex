server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bitvantage.online;

    ssl_certificate /etc/letsencrypt/live/bitvantage.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitvantage.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16m;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location = /api/auth/login {
        limit_req zone=bitvantage_login burst=5 nodelay;
        proxy_pass http://192.168.40.195:18080;
        include /etc/nginx/snippets/bitvantage-proxy.conf;
    }

    location / {
        proxy_pass http://192.168.40.195:18080;
        include /etc/nginx/snippets/bitvantage-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bitvantage.online;

    ssl_certificate /etc/letsencrypt/live/bitvantage.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitvantage.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bitvantage.online$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name bitvantage.online www.bitvantage.online;

    return 301 https://bitvantage.online$request_uri;
}
